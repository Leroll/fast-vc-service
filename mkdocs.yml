site_name: Fast-VC 文档
site_description: Fast-VC 实时流式语音转换服务的安装、接口、部署与设计文档
site_url: https://leroll.github.io/fast-vc-service/
repo_url: https://github.com/Leroll/fast-vc-service
repo_name: Leroll/fast-vc-service
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.view

plugins:
  - search:
      lang: [zh, en]

hooks:
  - tools/docs/hooks.py

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# 英文项目首页与英文用户索引同目录，构建钩子将前者映射为 en/project.md。
exclude_docs: |
  /en/README.md

# 保留链接可达的历史资料与任务记录，不将它们混入主要用户导航。
not_in_nav: |
  /specs/**
  /changelog/20*.md
  /changelog/releases_en.md
  /design/archive/**
  /getting_started/**
  /perfermance_tests/version*.md
  /todo.md
  /changelog/README.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 使用指南:
      - 文档首页: README.md
      - 项目介绍: project.md
      - 快速开始: getting-started/quick-start.md
      - 配置与部署: getting-started/configuration.md
      - 故障排查: getting-started/troubleshooting.md
  - API:
      - 概览: api/README.md
      - 语音转换: api/voice-conversion.md
      - 系统接口: api/system.md
      - 会话数据: api/session-data.md
  - 设计与评测:
      - 当前设计: design/README.md
      - 总体设计: design/总体设计.md
      - 服务启动与运行配置: design/服务启动与运行配置.md
      - 接入与协议适配: design/接入与协议适配.md
      - 会话与状态管理: design/会话与状态管理.md
      - 音频输入与缓冲: design/音频输入与缓冲.md
      - 流式转换流水线: design/流式转换流水线.md
      - 模型与参考音色: design/模型与参考音色.md
      - 数据记录与可观测性: design/数据记录与可观测性.md
      - 评测指南: evaluation/README.md
      - 历史性能报告: perfermance_tests/README.md
  - 开发与维护:
      - 维护入口: maintainers/README.md
      - 贡献指南: contributing.md
      - 文档维护: maintainers/documentation.md
      - 文档网站: design/文档网站.md
      - 版本历史: changelog/releases.md
  - English:
      - Documentation: en/index.md
      - Project overview: en/project.md
      - Quick start: en/getting-started/quick-start.md
      - Configuration and deployment: en/getting-started/configuration.md
      - Troubleshooting: en/getting-started/troubleshooting.md
      - API overview: en/api/README.md
      - Voice conversion: en/api/voice-conversion.md
      - System: en/api/system.md
      - Session data: en/api/session-data.md
