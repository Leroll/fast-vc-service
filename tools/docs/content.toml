# 已约定的译文范围；新增文档不会自动要求翻译。
[translations]
"README.md" = "docs/en/README.md"
"docs/README.md" = "docs/en/index.md"
"docs/getting-started/quick-start.md" = "docs/en/getting-started/quick-start.md"
"docs/getting-started/configuration.md" = "docs/en/getting-started/configuration.md"
"docs/getting-started/troubleshooting.md" = "docs/en/getting-started/troubleshooting.md"
"docs/api/README.md" = "docs/en/api/README.md"
