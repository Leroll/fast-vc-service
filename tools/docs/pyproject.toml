[project]
name = "fast-vc-docs"
version = "0.1.0"
description = "Fast-VC documentation build tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8,<10",
    "jieba>=0.42.1,<0.43",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
