name: 文档构建与发布

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'tools/docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - 'src/**'
      - 'configs/**'
      - 'examples/websocket/**'
      - '.env.example'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'tools/docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - 'src/**'
      - 'configs/**'
      - 'examples/websocket/**'
      - '.env.example'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 检查并构建文档
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.23'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tools/docs/uv.lock
      - name: 检查文档内容与同步提醒
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --project tools/docs --locked python tools/docs/check_content.py --base "$DOCS_BASE"
      - name: 验证文档检查器
        run: uv run --project tools/docs --locked python -m unittest discover -s tools/docs -p 'test_*.py'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - name: 安装网站构建依赖
        run: npm --prefix docs/website ci --ignore-scripts
      - name: 验证内容适配与链接兼容
        run: npm --prefix docs/website test
      - name: 构建文档
        run: npm --prefix docs/website run build
      - name: 验证生成网页
        run: uv run --project tools/docs --locked python tools/docs/check_site.py
      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: 发布到 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检查 Pages 配置
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 部署网页
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
